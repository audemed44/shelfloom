name: Test

on:
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)

      - name: PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Vet
        run: go vet ./cmd/... ./internal/...

      - name: Test
        run: go test -race -cover ./cmd/... ./internal/...

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        # tsconfig.json only holds project references ("files": []), so plain
        # `tsc --noEmit` checks nothing; -b builds the app and node projects.
        run: npx tsc -b

      - name: Test
        working-directory: frontend
        run: npm test
